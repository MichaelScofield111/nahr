[package]
name = "nahr"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ffmpeg-next = "8.1.0"
hound = "3.5.1"
whisper-rs = "0.16.0"
console = { version = "0.16.3", features = ["std"] }
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-examples = "0.10.2"
candle-transformers = "0.10.2"
hf-hub = "0.5.0"
tokenizers = "0.22.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
candle-core = { version = "0.10.2", features = ["accelerate"] }
candle-nn = { version = "0.10.2", features = ["accelerate"] }
candle-examples = { version = "0.10.2", features = ["accelerate"] }
candle-transformers = { version = "0.10.2", features = ["accelerate"] }
